<textarea rows="40" cols="100">
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Przykład użycia pętli Dziewulski Z52</title>
    <script language="JavaScript">
        document.write("<div style='font-size:2cm;color:red;'>Dziewulski</div>");
        document.write("<div style='font-size:5mm;color:blue;'>Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo. Demonstracja pętli zagnieżdżonych (pętla w pętli).</div>");
        for(var i_d = 1; i_d <= 10; i_d++) {
            for(var k_d = 1; k_d <= i_d; k_d++) {
                document.write("&nbsp;");
            }
            document.write(i_d + "<br>");
        }
    </script>
</head>
<body>
</body>
</html>
<!-- Dziewulski Z52_JS -->
</textarea>
