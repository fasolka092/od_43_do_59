<textarea rows="40" cols="100">
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Uzycie petli for do rysowania w trybie tekstowym Dziewulski Z54</title>
    <script language="JavaScript">
        document.write("<div style='font-size:2cm;color:red;'>Dziewulski</div>");
        document.write("<div style='font-size:5mm;color:blue;'>Uzycie petli for do rysowania w trybie tekstowym. Prostokat z gwiazdek o obliczonych wymiarach a i b (3 petle).</div>");

        var a_dzi = (10 % 4) + 5;   // liczba liter nazwiska = 10  ->  a = 7
        var b_dzi = (7 % 6) + 20;   // liczba liter imienia   = 7   ->  b = 21

        // Pierwsza petla - gorne poziome gwiazdki
        for(var i_dzi = 1; i_dzi <= b_dzi; i_dzi++) {
            document.write("*");
        }
        document.write("<br>");

        // Druga petla - srodkowe (pionowe) gwiazdki
        for(var i_dzi = 1; i_dzi <= a_dzi - 2; i_dzi++) {
            document.write("*&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>");
        }

        // Trzecia petla - dolne poziome gwiazdki
        for(var i_dzi = 1; i_dzi <= b_dzi; i_dzi++) {
            document.write("*");
        }
        document.write("<br>");
    </script>
</head>
<body>
</body>
</html>
<!-- Dziewulski Z54_JS -->
</textarea>
