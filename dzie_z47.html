<html>
<head>
    <meta charset="utf-8">
    <title>Dziewulski Z47_JS</title>
</head>
<body>
    <script>
        var dana_dzi = parseInt(prompt("Podaj liczbę:"));
        document.write("<div>ilość wykonania pętli = 12</div>");
        document.write("<div>wielkość liter = 41px</div>");
        if(dana_dzi % 2 == 0) {
            document.write("<div style='color:blue;font-size:41px;'>");
            for(var i_d = 1; i_d <= 12; i_d++) {
                document.write("<div>" + i_d + ". Dziewulski</div>");
            }
            document.write("</div>");
        } else {
            document.write("<div style='color:green;font-size:41px;'>");
            for(var i_d = 1; i_d <= 12; i_d++) {
                document.write("<div>" + i_d + ". Dominik</div>");
            }
            document.write("</div>");
        }
    </script>
</body>
</html>
