<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Przykład użycia pętli Dziewulski Z52</title>
    <script language="JavaScript">
        var a_dzi = prompt("podaj ile razy=", "");
        var inicjaly_dzi = prompt("podaj inicjaly=", "");
        for(var i_dzi = 1; i_dzi <= a_dzi; i_dzi++) {
            for(var k_dzi = 1; k_dzi <= i_dzi; k_dzi++) {
                document.write("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;");
            }
            document.write(i_dzi+ "_" + inicjaly_dzi + "_" + i_dzi + "<br>");
        }
    </script>
</head>
<body>
</body>
</html>
