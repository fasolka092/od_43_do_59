<html>
<head>
    <meta charset="utf-8">
    <title>Dziewulski Z46_JS</title>
</head>
<body>
    <script>
        document.write("ilość wykonania pętli = 12 <br>");
        document.write("wielkość liter = 41px <br>");
        for(var i_d = 1; i_d <= 12; i_d++) {
            if(i_d % 2 != 0) {
                document.write("<span style='font-size:41px;'>" + i_d + ". Dziewulski</span><br>");
            } else {
                document.write("<span style='font-size:41px;'>" + i_d + ". Dominik</span><br>");
            }
        }
    </script>
</body>
</html>
